# =============================================================================
# Render Blueprint — 𝑇ℎ𝑒 𝐼𝐶𝐵𝑆 𝑇𝑖𝑐𝑘𝑒𝑡 𝐵𝑜𝑡
# ----------------------------------------------------------------------------
# To deploy:
#   1. Push this file to your repo (done: github.com/worldguy36/ICBS-Ticket-Bot)
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" and select this repo
#   4. Render reads render.yaml and creates the service automatically
#   5. You'll be prompted to enter EVERY env var below — answer each question.
#
# After deploy, the service will be reachable at:
#   https://icbs-ticket-bot.onrender.com  (or your chosen subdomain)
# =============================================================================

services:
  - type: web
    name: icbs-ticket-bot
    runtime: bun
    plan: free
    region: oregon

    # Build: install deps at repo root (where package.json lives).
    buildCommand: bun install
    # Start: run the bot. It binds to 0.0.0.0:$PORT automatically.
    startCommand: bun mini-services/icbs-ticket-bot/index.ts

    # Render pings this path to check if the service is live.
    # / returns a tiny 200 JSON payload — perfect for the health check.
    healthCheckPath: /

    # Auto-deploy when you push to main.
    autoDeploy: true
    branch: main

    envVars:
      # =====================================================================
      #  REQUIRED — bot will not work without these
      # =====================================================================

      - key: DISCORD_BOT_TOKEN
        sync: false
        # Q: What is your Discord bot token?
        #
        # A secret token from the Discord Developer Portal that authenticates
        # your bot. Get it from:
        #   https://discord.com/developers/applications
        #   → your application → Bot → Reset Token → Copy
        #
        # Format: MTUzMzEyODgxMDg2OTAzMDk5Mg.GZ3VO7.xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        # ⚠️ NEVER share this token or commit it to git.

      - key: DISCORD_GUILD_ID
        sync: false
        # Q: What is your Discord server ID?
        #
        # The unique ID of the Discord server where the bot will operate.
        # To find it:
        #   1. Open Discord → User Settings → Advanced → enable Developer Mode
        #   2. Right-click your server name in the left sidebar
        #   3. Click "Copy ID"
        #
        # Format: 1509170609760763964  (a long number, no quotes needed)

      - key: ICBS_WEBHOOK_SECRET
        sync: false
        # Q: What secret do you want to use to authenticate admin API calls?
        #
        # This is a password YOU invent. It protects the bot's /setup-panel
        # endpoint so random people on the internet can't trigger it.
        # Generate one by running this in a terminal:
        #   openssl rand -hex 24
        # OR use any long random string you can remember.
        #
        # Format: e6f71b539f56bae5c56d5a4b96e5426fc4650e26fe63c879
        # ⚠️ Save this — you'll need to pass it as the x-icbs-secret header
        #    whenever you call /setup-panel.

      # =====================================================================
      #  CHANNEL IDs — where do ticket messages go?
      # =====================================================================

      - key: TICKET_PANEL_CHANNEL_ID
        sync: false
        # Q: Which Discord channel should the ticket panel be posted in?
        #
        # This is the channel where users will see the ticket panel embed +
        # dropdown menu to open tickets. Usually called #ticket-panel or
        # #support.
        #
        # To find it: right-click the channel name in Discord → Copy ID
        # (Developer Mode must be enabled — see DISCORD_GUILD_ID above)
        #
        # Format: 1533131440496316587

      - key: TICKET_LOG_CHANNEL_ID
        sync: false
        # Q: Which Discord channel should receive ticket logs + transcripts?
        #
        # When tickets are opened or closed, the bot posts a log message here.
        # When a ticket closes, the transcript .txt file is also posted here.
        # Usually called #ticket-logs or #staff-logs. Should be staff-only.
        #
        # To find it: right-click the channel name in Discord → Copy ID
        #
        # Format: 1533131442077302907

      - key: TICKET_CATEGORY_ID
        sync: false
        # Q: Which Discord channel category should ticket channels be created under?
        #
        # When a user opens a ticket, the bot creates a new text channel for
        # that ticket. It will be placed under this Discord Category (the
        # collapsible groups in your channel list). Usually called "Tickets"
        # or "Support".
        #
        # To find it: right-click the category name in Discord → Copy ID
        # (Right-click the category heading, not a channel inside it)
        #
        # Format: 1533131438587773021

      # =====================================================================
      #  ROLE IDs — who has access to tickets?
      # =====================================================================

      - key: TICKET_ADMIN_ROLE_ID
        sync: false
        # Q: Which Discord role should have full admin access to all tickets?
        #
        # Members with this role can claim, close, and reopen any ticket,
        # plus they're added to every new ticket channel automatically.
        # Usually @Admin, @Ticket Admin, or @ICBS Ticket Bot.
        #
        # To find it: Server Settings → Roles → right-click the role → Copy ID
        # (OR right-click a user who has the role → Roles → right-click role)
        #
        # Format: 1533130635131092995

      - key: TICKET_STAFF_ROLE_IDS
        sync: false
        # Q: Which Discord role(s) should be added to every ticket as staff?
        #
        # Members with these roles are notified when a ticket opens and can
        # interact with the ticket (claim, close, etc.). For multiple roles,
        # separate with commas.
        #
        # To find it: Server Settings → Roles → right-click each role → Copy ID
        #
        # Format (single role):  1510013691515502843
        # Format (multi role):   111111111111111111,222222222222222222,333333333333333333

      - key: HEAD_OF_SUPPORT_ROLE_IDS
        sync: false
        # Q: Which Discord role(s) count as Head of Support? (optional but recommended)
        #
        # Head of Support is a senior staff role. Members with this role can:
        #   - Use /ticket-promote to give Support Staff role to other users
        #   - Use /ticket-demote to remove Support Staff role
        #   - Use all regular staff commands
        # They count as staff automatically (no need to also add them to
        # TICKET_STAFF_ROLE_IDS, though you can if you want the role pings).
        #
        # You can also manage this at runtime via /ticket-head (admin-only).
        # Leave EMPTY to fall back to "anyone with Manage Roles permission".
        #
        # To find it: Server Settings → Roles → right-click each role → Copy ID
        #
        # Format: 111111111111111111  (or comma-separated for multiple)

      # =====================================================================
      #  OPTIONAL — advanced configuration
      # =====================================================================

      - key: ICBS_BOT_PORT
        sync: false
        # Q: Which port should the bot listen on? (leave empty on Render)
        #
        # Render sets PORT automatically — the bot reads it. This variable
        # is only used for local development. Leave EMPTY on Render.
        # If running locally, set to 3040.

      - key: ICBS_PUBLIC_URL
        sync: false
        # Q: What is the public URL of this Render web service? (for the logo)
        #
        # The bot serves its brand logo at /brand-icon.webp. To use it in
        # Discord embeds (which require absolute URLs), the bot needs to know
        # its own public URL. Enter your Render URL here.
        #
        # Format: https://icbs-ticket-bot.onrender.com
        # (or whatever subdomain you chose when creating the service)
        # Leave EMPTY to fall back to Discord's default avatar.

      - key: ICBS_BRAND_ICON_URL
        sync: false
        # Q: What URL should be used as the embed icon? (optional — overrides the logo)
        #
        # By default, the bot uses {ICBS_PUBLIC_URL}/brand-icon.webp (the logo
        # bundled with the bot). If you want to use a DIFFERENT icon hosted
        # elsewhere, paste its URL here. Otherwise leave EMPTY.
        #
        # Format: https://example.com/my-custom-logo.png
        # Leave EMPTY to use the bundled ICBS logo served at /brand-icon.webp.

      - key: TICKET_CATEGORY_ROLES
        sync: false
        # Q: Do you want to override the staff role per ticket category? (optional)
        #
        # By default, every ticket adds the role(s) from TICKET_STAFF_ROLE_IDS.
        # If you want different staff roles for different categories (e.g.
        # billing tickets go to @Billing Team, bug reports go to @Devs),
        # put a JSON map here.
        #
        # Format: {"general":"111","bug":"222","billing":"333","partnership":"444","appeal":"555"}
        # Leave EMPTY to use TICKET_STAFF_ROLE_IDS for all categories.
