# =============================================================================
# Keep-Alive Workflow — pings the bot every 5 minutes to prevent spin-down
# ----------------------------------------------------------------------------
# Render's free tier spins down web services after 15 minutes of inactivity.
# This workflow pings the bot's /uptime endpoint every 5 minutes, which keeps
# the service warm so the Discord bot stays connected.
#
# COST: Free for public repos (unlimited minutes). For private repos, GitHub
# gives 2,000 free minutes/month — this workflow uses ~6 runs/hour × 24h × 30d
# = 4,320 runs/month × ~2 sec/run = ~144 minutes/month. Well within the limit.
#
# SETUP (one-time, 30 seconds):
#   1. Go to your repo on GitHub: https://github.com/worldguy36/ICBS-Ticket-Bot
#   2. Settings → Secrets and variables → Actions → New repository secret
#   3. Name: BOT_URL
#   4. Value: https://icbs-ticket-bot.onrender.com
#      (or whatever your bot's public URL is — Render, Fly, Koyeb, etc.)
#   5. Click Add secret.
#
# The workflow will start running automatically within 5 minutes.
# =============================================================================

name: Keep Alive

on:
  schedule:
    # Every 5 minutes (UTC). GitHub Actions cron uses standard cron syntax.
    # Note: GitHub doesn't guarantee exact timing — runs may be delayed a few
    # minutes during peak load, but that's fine for keep-alive purposes.
    - cron: '*/5 * * * *'

  # Allow manual triggering from the Actions tab (for testing)
  workflow_dispatch:

jobs:
  ping:
    name: Ping bot to prevent spin-down
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /uptime endpoint
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          if [ -z "$BOT_URL" ]; then
            echo "❌ BOT_URL secret is not set."
            echo "   Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "   Add a secret named BOT_URL with your bot's public URL."
            echo "   Example: https://icbs-ticket-bot.onrender.com"
            exit 1
          fi

          echo "🏓 Pinging $BOT_URL/uptime ..."
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 30 "$BOT_URL/uptime" || echo "000")
          BODY=$(cat /tmp/response.txt 2>/dev/null || echo "(no response)")

          echo "HTTP status: $HTTP_CODE"
          echo "Response body: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Bot is alive and responding."
          else
            echo "⚠️ Bot responded with HTTP $HTTP_CODE (expected 200)."
            echo "   This might just be a cold start — Render takes ~30s to spin up."
            echo "   The next ping in 5 min should succeed."

            # Try once more after a 30s delay (in case of cold start)
            echo ""
            echo "🔄 Retrying in 30 seconds (in case of cold start)..."
            sleep 30
            HTTP_CODE2=$(curl -s -o /tmp/response2.txt -w "%{http_code}" --max-time 30 "$BOT_URL/uptime" || echo "000")
            BODY2=$(cat /tmp/response2.txt 2>/dev/null || echo "(no response)")
            echo "Retry HTTP status: $HTTP_CODE2"
            echo "Retry response body: $BODY2"

            if [ "$HTTP_CODE2" = "200" ]; then
              echo "✅ Retry succeeded — bot is alive."
            else
              echo "❌ Retry also failed. Check the bot's logs."
              # Don't exit 1 — we don't want failing runs to alert GitHub
              # (the bot might just be deploying). Just log it.
            fi
          fi

      - name: Ping /health (for logging)
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          if [ -z "$BOT_URL" ]; then
            exit 0
          fi
          echo ""
          echo "📊 Fetching /health for status log..."
          HEALTH=$(curl -s --max-time 30 "$BOT_URL/health" 2>/dev/null || echo "{}")
          if command -v jq > /dev/null 2>&1; then
            echo "$HEALTH" | jq '{mode, ready, uptime, openTickets: .stats.openTickets, totalTickets: .stats.totalTickets}' 2>/dev/null || echo "$HEALTH"
          else
            echo "$HEALTH"
          fi
